<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ThorStream</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#9147ff">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0e0e10; --panel:#18181b; --panel2:#1f1f23; --text:#efeff1;
  --sub:#adadb8; --accent:#9147ff; --accent2:#772ce8; --border:#2d2d33;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f7f7f8; --panel:#ffffff; --panel2:#f0f0f2; --text:#18181b;
    --sub:#53535f; --border:#e3e3e6;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0e10; --panel:#18181b; --panel2:#1f1f23; --text:#efeff1;
  --sub:#adadb8; --border:#2d2d33;
}
*{box-sizing:border-box}
html{background:#000}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex; flex-direction:column; height:100%;
}
header{
  flex:0 0 auto;
  padding:8px 12px; padding-top:calc(8px + env(safe-area-inset-top,0px));
  background:var(--panel); border-bottom:1px solid var(--border);
  display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  max-height:200px; overflow:hidden;
  transition:max-height .25s ease, padding .25s ease, opacity .2s ease;
}
header.collapsed{
  max-height:0; padding-top:0; padding-bottom:0; border-bottom:none; opacity:0; pointer-events:none;
}
#revealTab{
  position:fixed; top:calc(env(safe-area-inset-top,0px) + 6px); right:10px; z-index:20;
  padding:4px 10px; font-size:11px; border-radius:20px; opacity:.75; display:none;
  color:#fff; border-color:rgba(255,255,255,.5); background:rgba(0,0,0,.4);
}
#revealTab.show{display:block}

#chatSendBtn{
  position:absolute; right:14px; bottom:14px; z-index:15;
  width:34px; height:34px; border-radius:50%; padding:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--accent); color:#fff; border:none;
  box-shadow:0 2px 8px rgba(0,0,0,.4);
}
#chatSendBtn svg{width:15px; height:15px}
#chatSendBtn:active{background:var(--accent2)}
body.role-video #chatSendBtn, body.role-video #chatSendBar{display:none}
/* Chat-only (bottom) screen: hidden unless a signed-in session was handed over from the main window */
body.role-chat #chatSendBtn, body.role-chat #chatSendBar{display:none}
body.role-chat.can-send #chatSendBtn{display:flex}
body.role-chat.can-send #chatSendBar:not(.hidden){display:flex}

#chatSendBar{
  position:absolute; right:16px; bottom:16px; left:16px; z-index:16;
  display:flex; gap:8px;
}
#chatSendBar.hidden{display:none}
#chatSendInput{
  flex:1; background:var(--panel2); border:1px solid var(--border); color:var(--text);
  border-radius:20px; padding:10px 14px; font-size:14px;
}
#chatSendSubmit{border-radius:20px}
header .brand{font-weight:800; color:var(--accent); margin-right:4px; white-space:nowrap}
.ghost-btn{
  background:transparent; border:1px solid var(--border); color:var(--text);
}
#signInBtn img.avatar{width:18px; height:18px; border-radius:50%; vertical-align:middle; margin-right:6px}
#followedBar{
  order:98; width:100%; display:flex; gap:6px; overflow-x:auto; padding-top:4px;
}
.followed-chip{
  flex:0 0 auto; display:flex; align-items:center; gap:6px; background:var(--panel2);
  border:1px solid var(--border); border-radius:16px; padding:4px 10px 4px 4px;
  font-size:12px; cursor:pointer; white-space:nowrap;
}
.followed-chip img{width:22px; height:22px; border-radius:50%}
.followed-chip .live-dot{width:7px; height:7px; border-radius:50%; background:#eb0400; margin-right:2px}

#dualScreenBtn, #saverBtn{display:flex; align-items:center}
#saverBtn.on{background:rgba(145,71,255,.28); border-color:var(--accent)}

/* Message preview card (single-screen mode) — same look as the native card used in dual-screen mode */
#draftPreview{
  position:fixed; top:28px; left:50%; z-index:40; width:min(85vw, 640px);
  padding:14px 18px 18px; border-radius:22px; border:2px solid #9147ff;
  background:linear-gradient(135deg, rgba(38,28,64,.94), rgba(14,14,20,.94));
  opacity:0; transform:translate(-50%, -16px); pointer-events:none;
  transition:opacity .18s ease, transform .18s ease;
}
#draftPreview.show{opacity:1; transform:translate(-50%, 0)}
#draftPreview .dp-head{display:flex; align-items:center}
#draftPreview .dp-dot{width:8px; height:8px; border-radius:50%; background:#9147ff; margin-right:8px}
#draftPreview .dp-title{flex:1; font-size:11px; font-weight:700; letter-spacing:.12em; color:#b9a3ff}
#draftPreview .dp-count{font-size:11px; font-weight:700; color:#8b8b99}
#draftPreview .dp-count.warn{color:#ffc857}
#draftPreview .dp-count.over{color:#ff5c5c}
/* keeps the END of a very long message visible (where you're typing) by clipping from the top */
#draftPreview .dp-body{
  margin-top:10px; max-height:calc(12 * 1.25 * 17px); overflow:hidden;
  display:flex; flex-direction:column; justify-content:flex-end;
}
#draftPreview .dp-text{font-size:17px; line-height:1.25; color:#fff; white-space:pre-wrap; overflow-wrap:anywhere}
#draftPreview .caret{color:#9147ff}
button{
  background:var(--accent); color:#fff; border:none; border-radius:8px;
  padding:8px 14px; font-size:14px; font-weight:600; cursor:pointer;
}
button:active{background:var(--accent2)}
button:disabled{opacity:.5}
#status{font-size:11px; color:var(--sub); width:100%; order:99}

/* Fill all remaining vertical space. Video's REAL box permanently reserves
   room for chat — it never resizes, which is what avoids interrupting
   Twitch's player. For dual-screen full-bleed mode, we visually stretch it
   with a CSS transform (pure compositing, not a real resize) instead of
   changing its actual width — see applyDualScreenLayout() in the script. */
:root{ --chat-width: clamp(220px, 32vw, 380px); }
main{
  flex:1; min-height:0; position:relative;
}
#videoWrap{
  position:absolute; top:0; left:0; bottom:0; right:var(--chat-width);
  background:#000; transform-origin:top left;
}
#videoWrap iframe{position:absolute; inset:0; width:100%; height:100%; border:0; display:block}
#videoPlaceholder{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--sub); font-size:13px; text-align:center; padding:16px;
}
#chat{
  position:absolute; top:0; right:0; bottom:0;
  width:var(--chat-width); overflow-y:auto; overflow-x:hidden;
  padding:8px 10px; background:#000; color:#fff; border-left:1px solid var(--border);
  display:flex; flex-direction:column; gap:4px;
}
.msg{font-size:13px; line-height:1.5; word-wrap:break-word; overflow-wrap:anywhere}
.msg .name{font-weight:700; margin-right:4px}
.msg .emote{height:1.5em; vertical-align:middle; display:inline-block; margin:0 1px}
.sysmsg{font-size:11px; color:#9a9a9a; font-style:italic}
a{color:var(--accent)}

/* Dual-screen mode: chat hides, and video is visually stretched (via a JS-
   applied transform, not a resize) to fill the freed space full-bleed. */
body.role-video #chat{display:none}
body.role-video #videoWrap{right:0}
body.role-chat #videoWrap{display:none}
body.role-chat #chat{left:0; width:auto}
body.role-chat #revealTab{display:none !important}
body.role-chat header{display:none !important}

/* Only stack for genuinely narrow, tall (phone-portrait style) windows —
   the Thor's bottom screen is squarish but still wider than tall, so it
   keeps the side-by-side split, which shows far more chat lines. */
@media (max-width:480px) and (orientation:portrait){
  #chat{top:55%; left:0; right:0; bottom:0; width:auto; border-left:none; border-top:1px solid var(--border)}
}
</style>
</head>
<body>
<button id="revealTab" class="ghost-btn">▾ menu</button>
<header id="header">
  <span class="brand">ThorStream</span>
  <button id="signInBtn" class="ghost-btn">Sign in with Twitch</button>
  <button id="dualScreenBtn" class="ghost-btn" title="Dual-screen mode">
    <svg width="18" height="14" viewBox="0 0 18 14" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align:-2px;margin-right:5px">
      <rect x="1" y="1" width="16" height="5" rx="1.2" stroke="currentColor" stroke-width="1.4"/>
      <rect x="1" y="8" width="16" height="5" rx="1.2" stroke="currentColor" stroke-width="1.4"/>
    </svg>Dual Screen
  </button>
  <button id="saverBtn" class="ghost-btn" title="Battery saver: lower video quality, still emotes, lighter chat">
    <svg width="20" height="12" viewBox="0 0 20 12" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align:-2px;margin-right:5px">
      <rect x="1" y="1" width="15" height="10" rx="2" stroke="currentColor" stroke-width="1.4"/>
      <rect x="17" y="4" width="2" height="4" rx=".8" fill="currentColor"/>
      <rect x="3.5" y="3.5" width="6" height="5" rx="1" fill="currentColor"/>
    </svg><span id="saverLabel">Saver: Off</span>
  </button>
  <button id="collapseBtn" class="ghost-btn" title="Hide this bar">▴ hide</button>
  <div id="status">Sign in to see who's live.</div>
  <div id="followedBar"></div>
</header>
<main>
  <div id="videoWrap">
    <div id="videoPlaceholder">Video + chat will load here once connected.</div>
  </div>
  <div id="chat"></div>
  <button id="chatSendBtn" title="Send a message">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 3L18 10L2 17L5 10L2 3Z" fill="currentColor"/>
    </svg>
  </button>
  <div id="chatSendBar" class="hidden">
    <input id="chatSendInput" type="text" placeholder="Send a message" autocomplete="off" autocapitalize="sentences">
    <button id="chatSendSubmit">Send</button>
  </div>
</main>

<div id="draftPreview" aria-hidden="true">
  <div class="dp-head"><span class="dp-dot"></span><span class="dp-title">MESSAGE PREVIEW</span><span class="dp-count" id="dpCount">0 / 500</span></div>
  <div class="dp-body"><div class="dp-text" id="dpText"></div></div>
</div>

<script>
const $ = s => document.querySelector(s);
const chatEl = $('#chat'), statusEl = $('#status');
const videoWrap = $('#videoWrap');
const headerEl = $('#header'), revealTab = $('#revealTab'), collapseBtn = $('#collapseBtn');
const signInBtn = $('#signInBtn'), followedBar = $('#followedBar'), dualScreenBtn = $('#dualScreenBtn');
const chatSendBtn = $('#chatSendBtn'), chatSendBar = $('#chatSendBar');
const chatSendInput = $('#chatSendInput'), chatSendSubmit = $('#chatSendSubmit');
const saverBtn = $('#saverBtn'), saverLabel = $('#saverLabel');
const draftPreview = $('#draftPreview'), dpText = $('#dpText'), dpCount = $('#dpCount');

let ws = null;
let emoteMap = new Map();   // name -> img url (7TV, global+channel)
let currentChannel = '';
let autoHideTimer = null;

// ---- Header collapse (so video+chat can use the full screen) ----
function collapseHeader(){
  headerEl.classList.add('collapsed');
  revealTab.classList.add('show');
}
function expandHeader(temporary){
  headerEl.classList.remove('collapsed');
  revealTab.classList.remove('show');
  clearTimeout(autoHideTimer);
  if(temporary) autoHideTimer = setTimeout(collapseHeader, 5000);
}
collapseBtn.addEventListener('click', () => collapseHeader());
revealTab.addEventListener('click', () => expandHeader(true));

// ---- Twitch OAuth (Implicit Grant, client-side only — no secret needed) ----
// This Client ID belongs to the app itself (registered once by the developer
// at dev.twitch.tv/console/apps) — every person using this app signs in with
// their OWN Twitch username/password against this one app registration.
const TWITCH_CLIENT_ID = '9kl2f7rc2j9enwe9pl3sdyar7ckhvu';

const LS = {
  token: 'tstv_token',
  login: 'tstv_login',
  loginName: 'tstv_login_name', // canonical lowercase login — required for IRC auth, distinct from the display name shown in the UI
  userId: 'tstv_user_id',       // cached so the followed-streams check doesn't need an extra lookup call each time
  avatar: 'tstv_avatar',
  pendingRefresh: 'tstv_pending_refresh',
  dualChannel: 'tstv_dual_channel',
};

// True only in the bottom-screen chat window (loaded by native code with ?screen=chat).
const CHAT_ONLY = new URLSearchParams(location.search).get('screen') === 'chat';

// ---- Battery saver ----
// When on: video is capped at a lower quality (the biggest saving), emotes are shown as
// still images instead of animated ones, and chat keeps fewer messages and redraws less often.
// The main window remembers the choice; the bottom chat-only window is told by native code.
const SAVER_KEY = 'tstv_saver';
let bottomSaver = new URLSearchParams(location.search).get('saver') === '1';
function isSaver(){ return CHAT_ONLY ? bottomSaver : localStorage.getItem(SAVER_KEY) === '1'; }
function chatMax(){ return isSaver() ? 20 : 30; }
function chatFlushMs(){ return isSaver() ? 1000 : 250; }

async function signIn(){
  const redirect = window.location.origin + window.location.pathname; // clean URL, ignores any leftover ?query junk
  const url = 'https://id.twitch.tv/oauth2/authorize'
    + '?client_id=' + encodeURIComponent(TWITCH_CLIENT_ID)
    + '&redirect_uri=' + encodeURIComponent(redirect)
    + '&response_type=token'
    + '&scope=' + encodeURIComponent('user:read:follows chat:read chat:edit');
  window.location.href = url;
}

function signOut(){
  localStorage.removeItem(LS.token);
  localStorage.removeItem(LS.login);
  localStorage.removeItem(LS.loginName);
  localStorage.removeItem(LS.userId);
  localStorage.removeItem(LS.avatar);
  followedBar.innerHTML = '';
  updateSignInButton();
}

function updateSignInButton(){
  const login = localStorage.getItem(LS.login);
  const avatar = localStorage.getItem(LS.avatar);
  if(login){
    signInBtn.innerHTML = (avatar ? `<img class="avatar" src="${avatar}">` : '') + login;
    signInBtn.onclick = () => { if(confirm('Sign out of Twitch?')) signOut(); };
  } else {
    signInBtn.textContent = 'Sign in with Twitch';
    signInBtn.onclick = signIn;
  }
}

async function handleOAuthRedirect(){
  if(!location.hash.includes('access_token')) return;
  const params = new URLSearchParams(location.hash.slice(1));
  const token = params.get('access_token');
  history.replaceState(null, '', location.pathname + location.search);
  if(!token) return;
  localStorage.setItem(LS.token, token);
  try{
    const me = await fetch('https://api.twitch.tv/helix/users', {
      headers: { 'Client-Id': TWITCH_CLIENT_ID, 'Authorization': 'Bearer ' + token }
    }).then(r=>r.json());
    const user = me?.data?.[0];
    if(user){
      localStorage.setItem(LS.login, user.display_name);
      localStorage.setItem(LS.loginName, user.login);
      if(user.id) localStorage.setItem(LS.userId, user.id);
      localStorage.setItem(LS.avatar, user.profile_image_url);
    }
  }catch(e){ console.warn('Twitch user lookup failed', e); }
  updateSignInButton();
  loadFollowedLive(true);

  // If this page loaded in a plain browser tab (not the installed app
  // itself — display-mode tells us which), automatically hand control
  // back to the installed app now that sign-in is done, since localStorage
  // is already shared and the app just needs to be brought to front.
  const inInstalledApp = window.matchMedia('(display-mode: standalone)').matches
    || window.matchMedia('(display-mode: fullscreen)').matches;
  if(!inInstalledApp && token){
    localStorage.setItem(LS.pendingRefresh, '1'); // tell the app instance to hard-reload on next focus
    const returnIntent = 'intent:#Intent;package=io.github.ajhockey88.twa;'
      + 'action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end';
    const returnLink = document.createElement('a');
    returnLink.href = returnIntent;
    returnLink.textContent = 'Signed in! Tap here to return to ThorStream';
    returnLink.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;'
      + 'background:#0e0e10;color:#efeff1;font-size:18px;z-index:999;text-decoration:none;';
    document.body.appendChild(returnLink);
    setTimeout(() => { window.location.href = returnIntent; }, 600); // auto-attempt
  }
}

let lastFollowedFetch = 0;
const FOLLOWED_MIN_MS = 60 * 1000;

async function loadFollowedLive(force){
  if(CHAT_ONLY) return; // the bottom chat-only screen has no followed list
  const token = localStorage.getItem(LS.token);
  if(!token) return;
  const now = Date.now();
  // Resume events (focus + visibilitychange) fire in bursts — don't refetch for each one.
  if(!force && now - lastFollowedFetch < FOLLOWED_MIN_MS) return;
  lastFollowedFetch = now;
  const headers = { 'Client-Id': TWITCH_CLIENT_ID, 'Authorization': 'Bearer ' + token };
  try{
    let userId = localStorage.getItem(LS.userId);
    if(!userId){
      const me = await fetch('https://api.twitch.tv/helix/users', { headers }).then(r=>r.json());
      userId = me?.data?.[0]?.id;
      if(!userId) return;
      localStorage.setItem(LS.userId, userId);
    }
    const live = await fetch('https://api.twitch.tv/helix/streams/followed?user_id=' + userId, { headers }).then(r=>r.json());
    if(!live || !Array.isArray(live.data)) return; // expired token or API error — leave the list as it was
    renderFollowed(live.data);
  }catch(e){ console.warn('followed streams fetch failed', e); }
}

function renderFollowed(streams){
  followedBar.innerHTML = '';
  if(!streams.length){
    if(localStorage.getItem(LS.login)){
      const d = document.createElement('div');
      d.style.fontSize = '12px'; d.style.color = 'var(--sub)';
      d.textContent = 'None of your follows are live right now.';
      followedBar.appendChild(d);
    }
    return;
  }
  streams.forEach(s=>{
    const chip = document.createElement('div');
    chip.className = 'followed-chip';
    chip.innerHTML = `<span class="live-dot"></span>${s.user_name} · ${s.viewer_count.toLocaleString()}`;
    chip.addEventListener('click', () => watchChannel(s.user_login));
    followedBar.appendChild(chip);
  });
}

function setStatus(t){ statusEl.textContent = t; }

// ---- Chat rendering: batched ----
// Busy channels send many messages per second. Rendering each one immediately meant a
// full layout pass per message. Instead, messages are queued and drawn together a few
// times a second — and since only the newest 30 (20 in battery saver) are ever kept, anything older than
// that in a batch is skipped entirely instead of built and thrown away.
let pendingChat = [];
let flushTimer = null;

function queueChat(item){
  pendingChat.push(item);
  if(pendingChat.length > chatMax()) pendingChat.splice(0, pendingChat.length - chatMax());
  if(!flushTimer) flushTimer = setTimeout(flushChat, chatFlushMs());
}

function flushChat(){
  if(flushTimer){ clearTimeout(flushTimer); flushTimer = null; }
  if(!pendingChat.length) return;
  const items = pendingChat;
  pendingChat = [];
  const frag = document.createDocumentFragment();
  items.forEach(it => frag.appendChild(
    it.sys ? buildSystemNode(it.text) : buildMessageNode(it.text, it.emotesTag, it.displayName, it.color)));
  chatEl.appendChild(frag);
  trimAndScroll();
}

function clearChat(){
  pendingChat = [];
  if(flushTimer){ clearTimeout(flushTimer); flushTimer = null; }
  chatEl.innerHTML = '';
  emoteObserver.disconnect(); // release the removed emote images instead of letting the observer hold them
}

function buildSystemNode(t){
  const d = document.createElement('div');
  d.className = 'sysmsg';
  d.textContent = t;
  return d;
}

function addSystemMsg(t){ queueChat({ sys:true, text:t }); }

function trimAndScroll(){
  while(chatEl.children.length > chatMax()){
    const oldest = chatEl.firstChild;
    oldest.querySelectorAll && oldest.querySelectorAll('.emote').forEach(img => emoteObserver.unobserve(img));
    chatEl.removeChild(oldest);
  }
  chatEl.scrollTop = chatEl.scrollHeight;
}

// ---- 7TV emote loading (cached) ----
// The emote lists are large and rarely change. They used to be re-downloaded on every
// channel start; now a compact copy is kept for a few hours, so re-opening the app or
// switching back to a recent channel costs no network at all.
const EMOTE_CACHE_MS = 6 * 60 * 60 * 1000;
const EMOTE_CACHE_MAX_CHANNELS = 8;
const EMOTE_INDEX_KEY = 'tstv_7tv2_index';
// Drop the older cache format (it didn't store the still-image versions used by battery saver).
try{ Object.keys(localStorage).filter(k => k.startsWith('tstv_7tv_')).forEach(k => localStorage.removeItem(k)); }catch(e){}

function cacheGet(key){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return null;
    const o = JSON.parse(raw);
    return (o && Date.now() - o.t < EMOTE_CACHE_MS) ? o.v : null;
  }catch(e){ return null; }
}
function cacheSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify({ t: Date.now(), v: value })); }
  catch(e){ /* storage full — just skip caching */ }
}
function cacheChannelSet(channel, list){
  cacheSet('tstv_7tv2_ch_' + channel, list);
  try{
    const idx = JSON.parse(localStorage.getItem(EMOTE_INDEX_KEY) || '[]').filter(c => c !== channel);
    idx.push(channel);
    while(idx.length > EMOTE_CACHE_MAX_CHANNELS) localStorage.removeItem('tstv_7tv2_ch_' + idx.shift());
    localStorage.setItem(EMOTE_INDEX_KEY, JSON.stringify(idx));
  }catch(e){ /* not critical */ }
}

// Reduce 7TV's large response to just what we use: [[name, animatedUrl, stillUrl-or-null], ...]
function compactSevenTV(emotes){
  const out = [];
  (emotes || []).forEach(e => {
    try{
      const host = e.data.host;
      const file = host.files.find(f => f.name.endsWith('.webp')) || host.files[0];
      const base = 'https:' + host.url + '/';
      out.push([e.name, base + file.name, file.static_name ? base + file.static_name : null]);
    }catch(err){}
  });
  return out;
}

async function loadSevenTV(channel){
  emoteMap = new Map();

  let globalList = cacheGet('tstv_7tv2_global');
  if(!globalList){
    try{
      const g = await fetch('https://7tv.io/v3/emote-sets/global').then(r=>r.json());
      globalList = compactSevenTV(g.emotes);
      if(globalList.length) cacheSet('tstv_7tv2_global', globalList);
    }catch(e){ console.warn('7TV global load failed', e); globalList = []; }
  }
  globalList.forEach(([n, u, st]) => emoteMap.set(n, { u, s: st }));

  let channelList = cacheGet('tstv_7tv2_ch_' + channel);
  if(!channelList){
    channelList = [];
    try{
      const userRes = await fetch('https://api.ivr.fi/v2/twitch/user?login=' + encodeURIComponent(channel)).then(r=>r.json());
      const twitchId = Array.isArray(userRes) ? userRes[0]?.id : userRes?.id;
      if(twitchId){
        const stv = await fetch('https://7tv.io/v3/users/twitch/' + twitchId).then(r=> r.ok ? r.json() : null);
        if(stv){
          channelList = compactSevenTV(stv?.emote_set?.emotes);
          cacheChannelSet(channel, channelList);
        }
      }
    }catch(e){ console.warn('7TV channel load failed', e); }
  }
  channelList.forEach(([n, u, st]) => emoteMap.set(n, { u, s: st }));

  setStatus(`Loaded ${emoteMap.size} 7TV emotes for #${channel}. Connecting to chat…`);
}

// ---- Emote images: only animate while actually visible on screen ----
// Scrolling an animated emote out of view doesn't stop the browser from
// still decoding/rendering it unless we explicitly unload it — this is a
// real, ongoing battery cost on emote-heavy channels. The observer below
// loads an emote's image only when it's on screen, and unloads it (freezing
// it, stopping decode work entirely) the moment it scrolls out of view.
const emoteObserver = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    const img = entry.target;
    if(entry.isIntersecting){
      if(img.src !== img.dataset.src) img.src = img.dataset.src;
    } else {
      img.removeAttribute('src'); // stops animation/decoding entirely while scrolled away
    }
  });
}, { root: chatEl, rootMargin: '50px' });

function makeEmoteImg(url, alt){
  const img = document.createElement('img');
  img.className = 'emote';
  img.dataset.src = url;
  img.alt = alt;
  img.title = alt;
  emoteObserver.observe(img);
  return img;
}

// ---- Twitch native emote image from id ----
function twitchEmoteUrl(id){
  // 'static' is the still-image version of an emote; 'default' animates when the emote is animated.
  return `https://static-cdn.jtvnw.net/emoticons/v2/${id}/${isSaver() ? 'static' : 'default'}/dark/2.0`;
}

// ---- Render a chat message, applying Twitch tag emotes then 7TV word emotes ----
function buildMessageNode(text, emotesTag, displayName, color){
  const wrap = document.createElement('div');
  wrap.className = 'msg';

  const nameEl = document.createElement('span');
  nameEl.className = 'name';
  nameEl.textContent = displayName + ':';
  nameEl.style.color = color || '#9147ff';
  wrap.appendChild(nameEl);

  // Build list of {start,end,id} from Twitch emotes tag: id:s-e,s-e/id2:s-e
  let ranges = [];
  if(emotesTag){
    emotesTag.split('/').forEach(part=>{
      const [id, positions] = part.split(':');
      if(!positions) return;
      positions.split(',').forEach(p=>{
        const [s,e] = p.split('-').map(Number);
        ranges.push({start:s, end:e, id});
      });
    });
  }
  ranges.sort((a,b)=>a.start-b.start);

  const chars = Array.from(text); // codepoint-aware
  let cursor = 0;
  const frag = document.createDocumentFragment();

  function pushText(str){
    // 7TV word-level replacement on plain text segments
    const words = str.split(/(\s+)/);
    words.forEach(w=>{
      if(emoteMap.has(w)){
        const em = emoteMap.get(w);
        frag.appendChild(makeEmoteImg(isSaver() && em.s ? em.s : em.u, w));
      } else if(w.length){
        frag.appendChild(document.createTextNode(w));
      }
    });
  }

  ranges.forEach(r=>{
    if(r.start > cursor) pushText(chars.slice(cursor, r.start).join(''));
    const alt = chars.slice(r.start, r.end+1).join('');
    frag.appendChild(makeEmoteImg(twitchEmoteUrl(r.id), alt));
    cursor = r.end + 1;
  });
  if(cursor < chars.length) pushText(chars.slice(cursor).join(''));

  frag.insertBefore(document.createTextNode(' '), frag.firstChild);
  wrap.appendChild(frag);
  return wrap;
}

function renderMessage(text, emotesTag, displayName, color){
  queueChat({ text, emotesTag, displayName, color });
}

// ---- IRC ----
function parseTags(tagStr){
  const tags = {};
  tagStr.split(';').forEach(kv=>{
    const idx = kv.indexOf('=');
    if(idx === -1) return;
    tags[kv.slice(0,idx)] = kv.slice(idx+1);
  });
  return tags;
}

function connectIRC(channel, forceAnonymous){
  if(ws){ try{ ws.close(); }catch(e){} }
  const thisSocket = ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

  const token = !forceAnonymous && localStorage.getItem(LS.token);
  const login = !forceAnonymous && localStorage.getItem(LS.loginName);

  ws.onopen = () => {
    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    if(token && login){
      ws.send('PASS oauth:' + token);
      ws.send('NICK ' + login.toLowerCase());
    } else {
      ws.send('PASS SCHMOOPIIE');
      ws.send('NICK justinfan' + Math.floor(10000 + Math.random()*89999));
    }
    ws.send('JOIN #' + channel);
    setStatus('Connected to #' + channel + ' chat.');
  };

  ws.onmessage = ev => {
    ev.data.split('\r\n').forEach(line=>{
      if(!line) return;
      if(line.startsWith('PING')){ ws.send('PONG :tmi.twitch.tv'); return; }

      let tags = {};
      let rest = line;
      if(line.startsWith('@')){
        const sp = line.indexOf(' ');
        tags = parseTags(line.slice(1, sp));
        rest = line.slice(sp+1);
      }
      if(rest.includes('PRIVMSG')){
        const m = rest.match(/:(\S+)!\S+ PRIVMSG #\S+ :(.*)$/);
        if(m){
          const displayName = tags['display-name'] || m[1];
          const color = tags['color'];
          renderMessage(m[2], tags['emotes'], displayName, color);
        }
      }
      if(rest.includes('NOTICE') && rest.toLowerCase().includes('login authentication failed')){
        setStatus('Sign-in expired — reconnecting so chat still works. Sign out and back in to send messages.');
      }
    });
  };

  ws.onerror = () => setStatus('Chat connection error.');
  ws.onclose = () => {
    if(ws !== thisSocket) return; // a newer connection already replaced this one — ignore this stale event
    if(token){
      connectIRC(channel, true); // authenticated attempt failed (likely an expired token) — fall back so reading chat still works
      return;
    }
    setStatus('Chat disconnected.');
  };
}

function sendChatMessage(text){
  text = (text || '').trim();
  if(!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  if(!localStorage.getItem(LS.token)){
    setStatus('Sign in with Twitch to send messages.');
    return;
  }
  ws.send('PRIVMSG #' + currentChannel + ' :' + text);
  // Twitch's IRC doesn't echo your own sent messages back to you — render
  // it locally right away instead of waiting for something that never arrives.
  renderMessage(text, null, localStorage.getItem(LS.login) || 'You', '#9147ff');
  flushChat(); // your own message shows instantly, not after the batch delay
}

// ---- Pausing chat when nobody can see it ----
// Closing the connection on purpose: ws is cleared FIRST, so the close handler in
// connectIRC() knows it was intentional and doesn't try to reconnect.
function disconnectChat(){
  const s = ws;
  ws = null;
  if(s){ try{ s.close(); }catch(e){} }
  pendingChat = [];
  if(flushTimer){ clearTimeout(flushTimer); flushTimer = null; }
}
function reconnectChat(){
  if(!currentChannel || ws) return;
  clearChat();
  connectIRC(currentChannel);
  addSystemMsg('Chat resumed.');
}


// ---- Video (Twitch embed, parent = actual hosting domain) ----
let videoLoadId = 0;

function mountPlainVideo(channel){
  const iframe = document.createElement('iframe');
  const parent = window.location.hostname || 'localhost';
  iframe.src = `https://player.twitch.tv/?channel=${encodeURIComponent(channel)}&parent=${parent}`;
  iframe.allow = 'autoplay; fullscreen'; // needed for the iframe to be allowed to autoplay with sound
  iframe.allowFullscreen = true;
  videoWrap.appendChild(iframe);
}

function loadVideo(channel){
  const id = ++videoLoadId; // a newer call always wins over one still waiting on something
  videoWrap.innerHTML = '';
  if(isSaver()) loadVideoCapped(channel, id);
  else mountPlainVideo(channel);
}

// ---- Battery saver: cap the video quality ----
// Decoding video is the biggest battery cost by far. Twitch's own player library lets us ask
// for a lower quality; it's loaded only when saver is on. If it can't be loaded, or the stream
// has no lower quality, the video just plays normally and the status line says so.
let twitchLibPromise = null;
function loadTwitchLib(){
  if(window.Twitch && window.Twitch.Player) return Promise.resolve(true);
  if(!twitchLibPromise){
    twitchLibPromise = new Promise(resolve => {
      let settled = false;
      const finish = ok => { if(settled) return; settled = true; if(!ok) twitchLibPromise = null; resolve(ok); };
      const sc = document.createElement('script');
      sc.src = 'https://player.twitch.tv/js/embed/v1.js';
      sc.onload = () => finish(!!(window.Twitch && window.Twitch.Player));
      sc.onerror = () => finish(false);
      setTimeout(() => finish(false), 6000); // don't leave the video area blank if the script hangs
      document.head.appendChild(sc);
    });
  }
  return twitchLibPromise;
}

// From the qualities a stream offers, choose the best one at or below 480p (a good fit for a
// small screen). Returns null when there's nothing lower than the source to choose.
function pickSaverQuality(list){
  const cands = [];
  (list || []).forEach(q => {
    const id = typeof q === 'string' ? q : (q && (q.group || q.name));
    const label = typeof q === 'string' ? q : (q && (q.name || q.group));
    if(!id || String(id) === 'chunked') return;               // 'chunked' is the source quality
    const text = String(label || '') + ' ' + String(id);
    if(/audio|auto/i.test(text)) return;                        // audio-only / automatic aren't a lower video
    const m = /(\d{3,4})p(\d{2,3})?/.exec(text);
    if(!m) return;
    cands.push({ id: String(id), h: +m[1], fps: m[2] ? +m[2] : 30 });
  });
  if(!cands.length) return null;
  const low = cands.filter(c => c.h <= 480);
  const pool = low.length ? low : cands;
  pool.sort((a, b) => low.length ? (b.h - a.h || a.fps - b.fps) : (a.h - b.h || a.fps - b.fps));
  return pool[0].id;
}

async function loadVideoCapped(channel, id){
  const ok = await loadTwitchLib();
  if(id !== videoLoadId) return;
  if(!ok){
    mountPlainVideo(channel);
    setStatus("Battery saver: couldn't load Twitch's player controls, so video quality is unchanged.");
    return;
  }
  const holder = document.createElement('div');
  holder.id = 'twitchPlayerHolder';
  holder.style.cssText = 'position:absolute;inset:0';
  videoWrap.appendChild(holder);

  let player;
  try{
    player = new Twitch.Player('twitchPlayerHolder', {
      channel, parent: [window.location.hostname || 'localhost'],
      width: '100%', height: '100%', autoplay: true, muted: false,
    });
  }catch(e){
    videoWrap.innerHTML = '';
    mountPlainVideo(channel);
    setStatus("Battery saver: couldn't start Twitch's player controls, so video quality is unchanged.");
    return;
  }
  const allowAutoplay = () => {
    const f = holder.querySelector('iframe');
    if(!f) return false;
    f.allow = 'autoplay; fullscreen'; // same permission the plain player gets, so sound autoplay still works
    return true;
  };
  if(!allowAutoplay()){
    const mo = new MutationObserver(() => { if(allowAutoplay()) mo.disconnect(); });
    mo.observe(holder, { childList: true });
  }

  let done = false, tries = 0;
  const attempt = () => {
    if(done || id !== videoLoadId) return;
    tries++;
    try{
      const pick = pickSaverQuality(player.getQualities());
      if(pick){
        player.setQuality(pick);
        done = true;
        setStatus('Battery saver: video capped at ' + pick + '.');
        return;
      }
    }catch(e){ /* qualities aren't known yet — try again shortly */ }
    if(tries >= 5){ done = true; setStatus('Battery saver: this stream has no lower video quality to switch to.'); }
  };
  // The list of qualities only becomes known once the player has loaded, so try at a few moments.
  const P = Twitch.Player;
  try{ player.addEventListener(P.READY || 'ready', attempt); }catch(e){}
  try{ player.addEventListener(P.PLAYING || 'playing', attempt); }catch(e){}
  [1500, 3500, 6000, 9000].forEach(ms => setTimeout(attempt, ms));
}

async function watchChannel(channel){
  channel = (channel || '').trim().toLowerCase().replace(/^#/, '');
  if(!channel) return;
  currentChannel = channel;
  if(localStorage.getItem(LS.dualChannel)) localStorage.setItem(LS.dualChannel, channel); // keep a dual-screen partner window in sync, if active
  clearChat();
  if(!document.body.classList.contains('role-chat')) loadVideo(channel); // chat-only screen never shows video — skip it to save battery
  if(document.body.classList.contains('role-video')){
    // Top screen in dual mode: chat lives on the other screen, so don't connect or load emotes
    // here — just tell the bottom screen to switch to the new channel too.
    setStatus('Switched to #' + channel + ' — the bottom screen chat is switching too.');
    triggerNative('dual-screen-update', channel, { saver: isSaver() ? '1' : '0' });
    return;
  }
  setStatus('Loading 7TV emotes for #' + channel + '…');
  await loadSevenTV(channel);
  connectIRC(channel);
  addSystemMsg(`Joined #${channel}. ${emoteMap.size} 7TV emotes active.`);
  expandHeader(true); // briefly confirm, then auto-hide so video+chat get full screen
}

// ---- Dual-screen mode ----
// A web page can't paint two different physical displays at once — that
// needs native Android multi-display code. What we CAN do: detect which
// screen THIS window instance is currently on (by aspect ratio — the
// Thor's top screen is wide/16:9, the bottom is squarer) and show only
// that screen's relevant pane, full-bleed. Open the app on both screens
// (drag one instance to each) and each configures itself automatically,
// staying in sync on which channel via shared localStorage.
function detectScreenRole(){
  const forced = new URLSearchParams(location.search).get('screen');
  if(forced === 'chat' || forced === 'video') return forced;
  const ratio = window.innerWidth / window.innerHeight;
  return ratio > 1.4 ? 'video' : 'chat';
}

function applyDualScreenLayout(){
  const role = detectScreenRole();
  document.body.classList.remove('role-video', 'role-chat');
  document.body.classList.add(role === 'video' ? 'role-video' : 'role-chat');
}

async function toggleDualScreen(){
  const isActive = document.body.classList.contains('role-video') || document.body.classList.contains('role-chat');

  if(isActive){
    // Turn off — restore the normal single-window side-by-side view,
    // and tell native code to dismiss the second-screen chat window.
    document.body.classList.remove('role-video', 'role-chat');
    localStorage.removeItem(LS.dualChannel);
    triggerNative('dual-screen-off');
    setStatus('Dual-screen mode off.');
    if(currentChannel) loadVideo(currentChannel); // re-fit video cleanly to the normal (narrower) shape
    reconnectChat(); // chat was paused on this screen while the other screen showed it
    return;
  }

  if(!currentChannel){
    setStatus('Pick a live channel from your followed list first, then tap Dual Screen.');
    return;
  }
  localStorage.setItem(LS.dualChannel, currentChannel);
  applyDualScreenLayout();
  collapseHeader();
  // The chat pane is hidden on this screen in dual mode (the other screen shows it), so
  // stop receiving and rendering every message here for nobody to see.
  if(document.body.classList.contains('role-video')) disconnectChat();
  loadVideo(currentChannel); // re-fit video cleanly to the new full-width shape — no letterboxing
  triggerNative('dual-screen-on', currentChannel, {
    token: localStorage.getItem(LS.token),
    login: localStorage.getItem(LS.login),
    loginName: localStorage.getItem(LS.loginName),
    saver: isSaver() ? '1' : '0',
  });
  setStatus('Dual-screen mode on — chat should appear on the other screen automatically. Tap Dual Screen again to turn it off.');
}

// Fires the app's own custom link scheme, caught by a tiny invisible native
// Activity (see AndroidManifest.xml) that shows/hides chat on the second
// physical display. Wrapped in try/catch since this scheme only resolves
// inside the installed app itself — harmless no-op anywhere else (e.g. if
// you're testing this page in a plain desktop browser).
function triggerNative(action, channel, extras){
  try{
    const parts = [];
    if(channel) parts.push('channel=' + encodeURIComponent(channel));
    if(extras) Object.keys(extras).forEach(k => { if(extras[k]) parts.push(k + '=' + encodeURIComponent(extras[k])); });
    const a = document.createElement('a');
    a.href = 'thorstream://' + action + (parts.length ? ('?' + parts.join('&')) : '');
    document.body.appendChild(a);
    a.click();
    a.remove();
  }catch(e){ /* not running inside the installed app — ignore */ }
}
dualScreenBtn.addEventListener('click', toggleDualScreen);

function updateSaverButton(){
  saverBtn.classList.toggle('on', isSaver());

function setSaver(on){

    // If the bottom screen is showing chat, let it know too.
    if(document.body.classList.contains('role-video')) triggerNative('dual-screen-update', currentChannel, { saver: on ? '1' : '0' });
  }
}
saverBtn.addEventListener('click', () => setSaver(!isSaver()));

// Message preview while typing (the keyboard covers much of the screen you're typing on):
//  - Bottom screen in dual mode: native code shows the card on the top screen (window.ThorNative
//    only exists in that window).
//  - Single-screen mode: this page draws the same card itself, at the top of the screen.
function notifyDraft(t){
  if(window.ThorNative && ThorNative.draft){
    try{ ThorNative.draft(t || ''); }catch(e){ /* bridge unavailable */ }
    return;
  }
  localPreview(t || '');
}

function positionPreview(){
  const vv = window.visualViewport;
  // when the keyboard opens the visible area can shift — keep the card pinned to its top edge
  draftPreview.style.top = (28 + (vv ? vv.offsetTop : 0)) + 'px';
}
function localPreview(text){
  if(CHAT_ONLY) return;
  if(!text || !text.trim()){ draftPreview.classList.remove('show'); return; }
  dpText.textContent = text;
  const caret = document.createElement('span');
  caret.className = 'caret';
  caret.textContent = '\u258D';
  dpText.appendChild(caret);
  dpCount.textContent = text.length + ' / 500';
  dpCount.className = 'dp-count' + (text.length > 500 ? ' over' : (text.length > 450 ? ' warn' : ''));
  positionPreview();
  draftPreview.classList.add('show');
}
if(window.visualViewport){
  const reposition = () => { if(draftPreview.classList.contains('show')) positionPreview(); };
  visualViewport.addEventListener('resize', reposition);
  visualViewport.addEventListener('scroll', reposition);
}
function askPreviewPermissionOnce(){
  try{
    if(window.ThorNative && !localStorage.getItem('tstv_preview_asked')){
      localStorage.setItem('tstv_preview_asked', '1'); // only ever ask once
      if(!ThorNative.canPreview()) ThorNative.requestPreviewPermission();
    }
  }catch(e){ /* not on the chat-only screen */ }
}

chatSendBtn.addEventListener('click', () => {

chatSendSubmit.addEventListener('click', submitChatMessage);

// Single-screen only: hide the card when the keyboard goes away, bring it back when typing resumes.

// The app-in-a-second-display Presentation loads with ?screen=chat&channel=xyz
// — native code passes the channel directly since this WebView doesn't share
// localStorage with the main TWA window (different rendering engine/storage).
if(new URLSearchParams(location.search).get('screen') === 'chat'){
  applyDualScreenLayout();
  collapseHeader(); // full-bleed chat view — no controls needed here
  const ch = new URLSearchParams(location.search).get('channel');
  let chatOnlyStarted = false;
  let latestChannel = null; // set if the top screen switches channel before the session hand-off arrives

  // Called by native code once this page has loaded, handing over the signed-in
  // session from the main window (this WebView has its own separate storage).
  window.__thorstreamStart = function(session, channel){
    if(chatOnlyStarted) return;
    chatOnlyStarted = true;
    if(session && session.token && session.loginName){
      localStorage.setItem(LS.token, session.token);
      localStorage.setItem(LS.login, session.login || session.loginName);
      localStorage.setItem(LS.loginName, session.loginName);
      document.body.classList.add('can-send');
    } else {
      // Signed out on the main window — make sure no old session lingers here.
      localStorage.removeItem(LS.token);
      localStorage.removeItem(LS.login);
      localStorage.removeItem(LS.loginName);
    }
    watchChannel(latestChannel || channel || ch);
  };

  // Called by native code when the top screen changes channel (or battery saver) while in
  // dual-screen mode, so this chat follows along.
  window.__thorstreamUpdate = function(u){
    if(!u) return;
    if(typeof u.saver === 'boolean') bottomSaver = u.saver;
    if(u.channel){
      latestChannel = u.channel;
      if(chatOnlyStarted && u.channel !== currentChannel) watchChannel(u.channel);
    }
    trimAndScroll();
  };

  // Fallback: if the session never arrives (e.g. an older app build), still show chat, read-only.
  setTimeout(() => {
    if(!chatOnlyStarted && (latestChannel || ch)){
      chatOnlyStarted = true;
      localStorage.removeItem(LS.token);
      localStorage.removeItem(LS.login);
      localStorage.removeItem(LS.loginName);
      watchChannel(latestChannel || ch);
    }
  }, 3000);
}

// The Twitch sign-in tab is a separate window from this app (see signIn()) —
// it saves the token to shared localStorage itself. When you switch back
// here, just re-read that instead of waiting for a redirect that never
// lands in this particular window.
// If the app sits in the background, stop receiving chat after a while (a busy channel is a
// constant stream of network + CPU wakeups). The short delay avoids reconnecting on quick app
// switches. The bottom chat-only screen manages itself and is left alone here.
const HIDDEN_DISCONNECT_MS = 30000;
let hiddenTimer = null;
let chatSuspendedWhileHidden = false;
function handleVisibilityForChat(){
  if(CHAT_ONLY) return;
  if(document.hidden){
    clearTimeout(hiddenTimer);
    hiddenTimer = setTimeout(() => {
      if(document.hidden && ws){ chatSuspendedWhileHidden = true; disconnectChat(); }
    }, isSaver() ? Math.min(HIDDEN_DISCONNECT_MS, 10000) : HIDDEN_DISCONNECT_MS);
  } else {
    clearTimeout(hiddenTimer);
    if(chatSuspendedWhileHidden){
      chatSuspendedWhileHidden = false;
      if(!document.body.classList.contains('role-video')) reconnectChat();
    }
  }
}
document.addEventListener('visibilitychange', () => {
  handleVisibilityForChat();
  if(document.visibilityState === 'visible' && localStorage.getItem(LS.pendingRefresh)){
    localStorage.removeItem(LS.pendingRefresh);
    if(!localStorage.getItem(LS.login)){ location.reload(); return; }
  }
  if(document.visibilityState === 'visible' && localStorage.getItem(LS.token)){
    updateSignInButton();
    loadFollowedLive();
  }
});
window.addEventListener('focus', () => {
  if(localStorage.getItem(LS.pendingRefresh)){
    localStorage.removeItem(LS.pendingRefresh);
    if(!localStorage.getItem(LS.login)){ location.reload(); return; }
  }
  if(localStorage.getItem(LS.token)){ updateSignInButton(); loadFollowedLive(); }
});
// Covers the case where Android hands the OAuth redirect back to this exact
// already-running app instance without a full page reload — only the hash
// changes, so a plain page-load listener alone would miss it.
window.addEventListener('hashchange', () => { handleOAuthRedirect(); });

// Belt-and-suspenders for the Chrome sign-in hand-off: when the sign-in tab writes the
// "pending refresh" flag, this window is told right away by the browser's storage event.
// (This replaces a timer that woke the CPU every 1.2 seconds just to check for it.)
window.addEventListener('storage', e => {
  if(e.key === LS.pendingRefresh && e.newValue){
    localStorage.removeItem(LS.pendingRefresh);
    if(!localStorage.getItem(LS.login)) location.reload();
  }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* fine over file:// or unsupported contexts */ });
  });
}
</script>
